winlogbeat.event_logs:
  - name: Security
    ignore_older: 72h
  - name: System
    ignore_older: 72h
  - name: Application
    ignore_older: 72h

processors:
  - add_fields:
      target: siem
      fields:
        environment: poc
        source_type: windows_event
        project: banking-siem

output.elasticsearch:
  hosts: ["http://localhost:9200"]
  index: "logs-windows-%{+yyyy.MM.dd}"

setup.template.enabled: false
setup.ilm.enabled: false
